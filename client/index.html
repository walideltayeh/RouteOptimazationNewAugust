<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/png" href="/logo.png" />
    <meta name="theme-color" content="#0B0F1A" />
    <title>RouteOptima · Route-to-market planner</title>
    <script>
      // The saved theme, before the first paint (see client/src/lib/theme.ts).
      try { if (localStorage.getItem("routeoptima:theme") === "dark") { document.documentElement.classList.add("dark"); document.documentElement.style.colorScheme = "dark"; } } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- This is a replit script which adds a banner on the top of the page when opened in development mode outside the replit environment -->
    <script type="text/javascript" src="https://replit.com/public/js/replit-dev-banner.js"></script>
  </body>
</html>
